<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050611">
  <title>OUR UNIVERSE v4.8.0</title>
</head>
<body style="margin:0;min-height:100dvh;display:grid;place-items:center;padding:18px;box-sizing:border-box;background:radial-gradient(circle at 50% 20%,#392467,#050611 62%);color:#fff;font-family:system-ui">
  <main style="width:min(440px,100%);padding:30px 24px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025));text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.48);backdrop-filter:blur(18px)">
    <div style="width:74px;height:74px;margin:auto;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#b9a7ff 16%,#6359bf 52%,#171937 78%);box-shadow:0 0 50px rgba(158,137,255,.42);font-size:30px">♡</div>
    <p style="margin:18px 0 6px;color:#d8cff8;font-size:10px;font-weight:800;letter-spacing:.2em">THE LIVING GALAXY</p>
    <h2 style="margin:0 0 8px;font-size:25px">Menyalakan Cinematic Polish</h2>
    <p style="margin:0;color:#c8c0d8;line-height:1.6">Cache lama sedang dibersihkan agar tampilan v4.8.0, navigasi mobile, dan atmosfer galaxy terbaru langsung digunakan.</p>
  </main>
  <script>
    ;(async()=>{
      try{
        if('serviceWorker' in navigator){const registrations=await navigator.serviceWorker.getRegistrations();await Promise.all(registrations.map(item=>item.unregister()))}
        if('caches' in window){const names=await caches.keys();await Promise.all(names.map(name=>caches.delete(name)))}
      }catch(error){console.warn(error)}
      location.replace('./?v=480&fresh='+Date.now())
    })()
  </script>
</body>
</html>
