<body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#050611;color:#fff;font-family:system-ui">
  <main style="padding:28px;text-align:center">
    <h2>Memuat perbaikan peta...</h2>
    <p>Cache lama sedang dibersihkan.</p>
  </main>
  <script>
    ;(async () => {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations()
          await Promise.all(registrations.map(item => item.unregister()))
        }

        if ('caches' in window) {
          const names = await caches.keys()
          await Promise.all(names.map(name => caches.delete(name)))
        }
      } catch (error) {
        console.warn(error)
      }

      location.replace('./?v=449&fresh=' + Date.now())
    })()
  </script>
