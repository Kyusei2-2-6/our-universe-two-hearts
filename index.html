<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050713">
  <meta name="description" content="Our Universe, semesta digital privat yang dibangun dan ditumbuhkan oleh dua orang.">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://esm.sh; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://esm.sh; font-src 'self' data:; object-src 'none'; frame-src 'self' blob:; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
  <meta property="og:title" content="Our Universe">
  <meta property="og:description" content="Di alam semesta yang begitu luas, aku tetap menemukanmu.">
  <meta property="og:image" content="images/social-cover.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <title>Our Universe</title>

  <!-- readability-hotfix -->
  <style>
    :root{
      --ou-text-strong: rgba(250, 252, 255, 0.98);
      --ou-text-body: rgba(232, 237, 250, 0.94);
      --ou-text-soft: rgba(214, 221, 242, 0.84);
      --ou-readable-surface: rgba(14, 11, 31, 0.36);
      --ou-readable-surface-strong: rgba(10, 9, 24, 0.58);
    }

    .hero,
    .hero-section,
    .page-hero,
    .section-hero,
    .world-hero,
    .page-header,
    .section-header,
    .music-hero,
    .intro-card,
    .glass-card,
    .card,
    .panel,
    .surface,
    .content-card,
    .music-card,
    .entry-card,
    .timeline-card,
    .letter-card {
      position: relative;
      isolation: isolate;
    }

    .hero::before,
    .hero-section::before,
    .page-hero::before,
    .section-hero::before,
    .world-hero::before,
    .page-header::before,
    .section-header::before,
    .music-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      border-radius: inherit;
      background: linear-gradient(
        180deg,
        rgba(9, 8, 23, 0.62) 0%,
        rgba(13, 11, 29, 0.42) 55%,
        rgba(13, 11, 29, 0.18) 100%
      );
    }

    .glass-card,
    .card,
    .panel,
    .surface,
    .content-card,
    .music-card,
    .entry-card,
    .timeline-card,
    .letter-card {
      background: rgba(14, 11, 31, 0.34) !important;
      border: 1px solid rgba(255,255,255,0.14) !important;
      box-shadow: 0 20px 50px rgba(6, 7, 18, 0.22);
    }

    h1, h2, h3, h4,
    .hero-title,
    .section-title,
    .page-title,
    .headline,
    .display-title,
    .title {
      color: var(--ou-text-strong) !important;
      text-shadow:
        0 2px 18px rgba(6, 7, 18, 0.45),
        0 1px 2px rgba(0, 0, 0, 0.35);
    }

    p, li, small,
    .hero-subtitle,
    .section-copy,
    .lead,
    .description,
    .muted,
    .subtitle,
    .card-copy,
    .card-description,
    .eyebrow + *,
    .section p,
    .card p,
    .panel p,
    .surface p {
      color: var(--ou-text-body) !important;
      text-shadow: 0 1px 10px rgba(6, 7, 18, 0.18);
    }

    .eyebrow,
    .label,
    .meta,
    .caption,
    .hint {
      color: var(--ou-text-soft) !important;
    }

    button,
    .btn,
    .button,
    .chip {
      text-shadow: none !important;
    }

    input,
    textarea,
    select {
      color: var(--ou-text-strong) !important;
      background: rgba(10, 12, 25, 0.56) !important;
      border-color: rgba(255,255,255,0.12) !important;
    }

    ::placeholder {
      color: rgba(223, 229, 246, 0.64) !important;
    }
  </style>
  
</head>
<body>
  <a class="skip-link" href="#app-shell">Lewati intro</a>
  <canvas id="universe-canvas" aria-hidden="true"></canvas>

  <section id="intro" class="intro" aria-label="Pembukaan sinematik">
    <div class="intro__vignette"></div>
    <div class="intro__content">
      <p id="intro-kicker" class="intro__kicker">OUR UNIVERSE</p>
      <p id="intro-quote" class="intro__quote">Di alam semesta yang begitu luas, aku tetap menemukanmu.</p>
      <button id="enter-universe" class="button button--primary intro__button" type="button">
        <span>Masuk ke Semesta Kita</span><span aria-hidden="true">✦</span>
      </button>
    </div>
    <button id="skip-intro" class="intro__skip" type="button">Lewati intro</button>
  </section>

  <main id="app-shell" class="app-shell" hidden>
    <header class="topbar glass-panel">
      <button id="home-button" class="icon-button" type="button" aria-label="Kembali ke Galaxy Hub">✦</button>
      <div class="brand">
        <span class="brand__eyebrow">OUR</span>
        <strong class="brand__title">UNIVERSE</strong>
      </div>
      <div id="member-presence" class="member-presence" aria-label="Anggota semesta"></div>
      <div class="topbar__actions">
        <button id="global-search" class="icon-button" type="button" aria-label="Cari semua isi">⌕</button>
        <button id="sound-toggle" class="icon-button" type="button" aria-label="Aktifkan atau matikan suara">◉</button>
        <button id="profile-button" class="avatar-button" type="button" aria-label="Profil dan pengaturan"><span>♡</span></button>
      </div>
    </header>

    <section id="galaxy-hub" class="galaxy-hub" aria-labelledby="hub-title">
      <div class="hub-copy">
        <p class="eyebrow" id="hub-eyebrow">SEMESTA MILIK KALIAN</p>
        <h1 id="hub-title">Semesta yang tumbuh bersama.</h1>
        <p id="hub-subtitle">Setiap kenangan menyalakan bintang baru.</p>
      </div>
      <div id="orbit-cards" class="orbit-cards" aria-label="Dunia di dalam semesta"></div>
      <div id="growth-meter" class="growth-meter glass-panel" aria-live="polite"></div>
      <div id="empty-universe-hint" class="empty-universe-hint glass-panel" hidden>
        <span class="empty-universe-hint__star">✦</span>
        <div><strong>Semesta ini masih sunyi.</strong><p>Tambahkan kenangan pertama kalian dan biarkan bintang pertama lahir.</p></div>
        <button class="button button--primary" type="button" data-open-composer>Tambahkan yang pertama</button>
      </div>
    </section>

    <section id="world-stage" class="world-stage" hidden aria-live="polite"></section>

    <button id="studio-fab" class="studio-fab" type="button" aria-label="Tambahkan sesuatu ke semesta">
      <span aria-hidden="true">＋</span><span>Tambahkan</span>
    </button>
  </main>

  <section id="auth-root" class="auth-root" hidden aria-live="polite"></section>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <audio id="ambient-audio" src="music/ambient-space.wav" loop preload="none"></audio>
  <noscript>Our Universe membutuhkan JavaScript untuk menjalankan pengalaman interaktif.</noscript>
  <script src="js/bootstrap-fallback.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
